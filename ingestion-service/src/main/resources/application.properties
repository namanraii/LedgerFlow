spring.application.name=ingestion-service
server.port=8082

fraud.service.url=${FRAUD_SERVICE_URL:http://127.0.0.1:8010}
ledger.service.url=${LEDGER_SERVICE_URL:http://127.0.0.1:8081}
ingestion.thread.pool.size=25
ingestion.queue.capacity=200

logging.level.com.ledgerflow.ingestion=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
